name: Post best TikTok video to Facebook

on:
  workflow_dispatch: {}   # triggered externally by cron-job.org

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run bot
        env:
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: python apify_to_fb.py

      - name: Save posted log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posted_log_fb.txt
          git diff --staged --quiet || git commit -m "Update Facebook posted videos log"
          git push
